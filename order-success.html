<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Successful</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    width:450px;
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.check{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:50%;
    background:#28a745;
    color:white;
    font-size:60px;
    display:flex;
    justify-content:center;
    align-items:center;
}

h1{
    color:#28a745;
}

button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:8px;
    background:#E96c28;
    color:white;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#d65d1d;
}

</style>
</head>

<body>

<div class="box">

<div class="check">
✔
</div>

<h1>Order Placed Successfully!</h1>

<p>
Thank you for ordering from
<b>Cakery Bakery</b>.
</p>

<p>

Your delicious order will arrive soon.
</p>
<h3>Your Order</h3>

<div id="orderList"></div>

<button onclick="goHome()">
Continue Shopping
</button>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let orderList = document.getElementById("orderList");

let total = 0;

cart.forEach(item => {

    total += item.price;

    orderList.innerHTML += `
        <p>
            🍰 ${item.name} - ₹${item.price}
        </p>
    `;
});

orderList.innerHTML += `
    <hr>
    <h3>Total : ₹${total}</h3>
`;

localStorage.removeItem("cart");

function goHome(){
    window.location.href = "index.html";
}

</script>

</body>
</html>
