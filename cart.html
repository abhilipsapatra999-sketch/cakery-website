<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

.container{
    width:80%;
    margin:30px auto;
}

h1{
    text-align:center;
    color:#E96c28;
}

.cart-item{
    background:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

button{
    background:#E96c28;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

.total{
    text-align:right;
    font-size:22px;
    margin-top:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>🛒 Your Cart</h1>

<div id="cartItems"></div>

<h2 class="total">
Total : ₹<span id="total">0</span>
</h2>

<button onclick="checkout()">
Checkout
</button>

</div>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let cartItems =
document.getElementById("cartItems");

let total=0;

cart.forEach((item,index)=>{

total+=item.price;

cartItems.innerHTML+=`

<div class="cart-item">

<div>

<h3>${item.name}</h3>

<p>₹${item.price}</p>

</div>

<button onclick="removeItem(${index})">

Remove

</button>

</div>

`;

});

document.getElementById("total").innerHTML=total;

function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

location.reload();

}

function checkout(){

window.location.href="order-success.html";

}

</script>

</body>
</html>
